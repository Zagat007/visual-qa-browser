name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci --ignore-scripts

      - name: Install Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Static repository contracts
        run: npm run static:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Publish test failure output
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failure output (${{ matrix.os }})"
            echo
            echo '<details><summary>Last 300 lines of test output</summary>'
            echo
            echo '```text'
            tail -n 300 test-output.log | sed -e 's/\x1b\[[0-9;]*m//g'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          excerpt=$(tail -n 120 test-output.log | sed -e 's/\x1b\[[0-9;]*m//g')
          excerpt=${excerpt//'%'/'%25'}
          excerpt=${excerpt//$'\r'/'%0D'}
          excerpt=${excerpt//$'\n'/'%0A'}
          echo "::error title=Test failure output ${{ matrix.os }}::${excerpt}"

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
